# AGP 8.7 / Gradle 8.11 do not support JDK 25 (the machine default here); the
# embedded Kotlin script compiler fails to parse its version string. Pin the
# daemon to the installed JDK 21.
org.gradle.java.home=C\:\\Program Files\\Microsoft\\jdk-21.0.11.10-hotspot

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.parallel=true
